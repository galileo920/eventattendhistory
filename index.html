<title>イベント参加履歴</title>
<style>
:root{
  --bg:#f5f3fa;--card:#fff;--fg:#1c1b22;--sub:#6b6a76;--line:#e4e1ee;
  --accent:#7c3aed;--accent-fg:#fff;--danger:#dc2626;--ok:#16a34a;
}

  :root{--bg:#121117;--card:#1c1b24;--fg:#f1f0f7;--sub:#9a98a8;--line:#2e2c3a;--accent:#a78bfa;--accent-fg:#1c1b22}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:16px}

main{padding:12px 16px;max-width:640px;margin:0 auto}

.stats .card{flex:1;text-align:center;margin:0}

label{display:block;margin-top:12px;font-size:13px;color:var(--sub)}
.row{display:flex;gap:8px}

input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:46px;display:block}

.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}

.scan{display:flex;gap:8px}
.scan label.btn{margin-top:0;text-align:center;color:var(--accent-fg);font-size:15px;cursor:pointer}
.scan label.btn.sec{color:var(--fg)}
.scan input{display:none}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:10px;display:block}
.status{margin-top:10px;font-size:14px}
.status.err{color:var(--danger)}.status.ok{color:var(--ok)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.h2{font-size:15px;margin:18px 0 6px;color:var(--sub)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:7}
.thumb{width:100%;border-radius:10px;margin-top:8px}
.search{margin-bottom:10px}
.prow{display:flex;gap:8px;align-items:center}
.prow+.prow{margin-top:6px}
.prow input{margin-top:4px}
.prow .rm{flex:0 0 44px;height:46px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--sub);font-size:20px;cursor:pointer}
.chips{display:flex;flex-wrap:nowrap;gap:6px;margin-top:4px}
.chip{flex:1 1 0;min-width:0}
.chip{position:relative}
.chip input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.chip span{display:block;text-align:center;white-space:nowrap;padding:10px 0;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font-size:15px}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{flex:1;min-width:0;margin-top:0}
.seg{display:flex;gap:6px;margin:14px 0 8px}
.seg button{flex:1;padding:10px 0;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:15px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
</style>

<body>
<header><h1 id="title">イベント参加履歴</h1></header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="追加">＋</button>
<nav class="tabs">
  <button data-tab="list" class="on"><span>🎫</span>履歴</button>
  <button data-tab="stats"><span>📊</span>集計</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<script>
"use strict";
/* ========== IndexedDB ========== */
const DB_NAME = "livelog", STORE = "lives";
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
let dbp = openDB();
async function tx(mode, fn){
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx("readonly", s => s.getAll());
const dbPut = v => tx("readwrite", s => s.put(v));
const dbDel = id => tx("readwrite", s => s.delete(id));
const dbClear = () => tx("readwrite", s => s.clear());

/* ========== 設定(localStorage) ========== */
const DEFAULT_MODEL = "claude-sonnet-5-5";
function getSet(){
  try { return JSON.parse(localStorage.getItem("livelog_settings") || "{}"); } catch(e){ return {}; }
}
function setSet(o){
  try { localStorage.setItem("livelog_settings", JSON.stringify({...getSet(), ...o})); } catch(e){}
}

/* ========== ユーティリティ ========== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GENRES = ["音楽","お笑い","舞台","トーク"];
const genreOf = l => l && l.genre === "ライブ" ? "音楽" : l && l.genre === "演劇" ? "舞台" : GENRES.includes(l && l.genre) ? l.genre : "音楽";
const FIELDS = ["genre","title","artist","venue","date","open","start","seatType","seat","price","setlist"];
/* 自動入力・貼り付け取り込みの対象(同行者・セットリスト・メモは手入力のみ) */
const AUTO_FIELDS = ["genre","title","artist","venue","date","open","start","seatType","seat","price"];

function fmtDate(d){
  if(!d) return "日付未設定";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if(!m) return d;
  const w = "日月火水木金土"[new Date(+m[1], +m[2]-1, +m[3]).getDay()];
  return `${m[1]}/${+m[2]}/${+m[3]}(${w})`;
}
function yen(n){ return n || n === 0 ? "¥" + Number(n).toLocaleString() : ""; }

/* 画像を縮小してJPEGのdataURLに */
function resizeImage(file, max, quality){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

/* ========== Claude API ========== */
async function extractFromImage(dataUrl){
  const {apiKey, model} = getSet();
  if(!apiKey) throw new Error("設定タブでAPIキーを入力してください");
  const b64 = dataUrl.split(",")[1];
  const prompt = `この画像はライブ・コンサートなどのイベントの紙のチケット、電子チケット(チケットぴあ・イープラス・ローチケ等のアプリ画面のスクリーンショット)、フライヤー、ポスター、または予約画面です。購入者の名前は含めないでください。複数日にまたがる券の場合、dateは初日にしてください。読み取れる情報を次のJSONだけで返してください(説明文やコードブロックは不要)。読み取れない項目は空文字にしてください。推測で埋めないでください。
{
 "genre":"ジャンル(音楽・お笑い・舞台・トークのいずれか。判断できなければ空文字)",
 "title":"公演名・イベント名・ツアー名",
 "artist":"出演者名(複数の場合は「、」で区切る)",
 "date":"開催日 YYYY-MM-DD(年が不明なら ${new Date().getFullYear()} とみなす)",
 "venue":"会場名",
 "open":"開場時刻 HH:MM",
 "start":"開演時刻 HH:MM",
 "seatType":"席種(例: 一般指定席、スタンディング、グッズ付指定席)",
 "seat":"座席・整理番号(例: 11列40番、整理番号C 266番)",
 "price":"チケット代(数字のみ)"
}`;
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      max_tokens: 1000,
      messages: [{role: "user", content: [
        {type: "image", source: {type: "base64", media_type: "image/jpeg", data: b64}},
        {type: "text", text: prompt}
      ]}]
    })
  });
  if(!r.ok){
    let msg = "";
    try { msg = (await r.json()).error?.message || ""; } catch(e){}
    throw new Error(`APIエラー(${r.status}) ${msg}`);
  }
  const j = await r.json();
  const text = (j.content || []).map(c => c.text || "").join("");
  const m = /\{[\s\S]*\}/.exec(text);
  if(!m) throw new Error("読み取り結果を解析できませんでした");
  return JSON.parse(m[0]);
}

/* ========== 画面 ========== */
let tab = "list";
let lives = [];
let query = "";
let fGenre = "", fYear = "", statTab = "artist";
const yearOf = l => (l.date || "").slice(0, 4);
const filtered = () => lives.filter(l => (!fGenre || genreOf(l) === fGenre) && (!fYear || yearOf(l) === fYear));
function filterBar(){
  const ys = [...new Set(lives.map(yearOf).filter(Boolean).concat(fYear ? [fYear] : []))].sort().reverse();
  return `<div class="filters"><select id="fg" aria-label="ジャンルで絞り込み"><option value="">ジャンル(すべて)</option>${GENRES.map(g => `<option value="${g}"${fGenre === g ? " selected" : ""}>${g}</option>`).join("")}</select><select id="fy" aria-label="年で絞り込み"><option value="">年(すべて)</option>${ys.map(y => `<option value="${y}"${fYear === y ? " selected" : ""}>${y}年</option>`).join("")}</select></div>`;
}
function bindFilter(){
  $("#fg").onchange = e => { fGenre = e.target.value; render(); };
  $("#fy").onchange = e => { fYear = e.target.value; render(); };
}


async function refresh(){ lives = await dbAll(); }

function setTab(t){
  tab = t;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#fab").style.display = t === "list" ? "" : "none";
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#fab").onclick = () => openForm();

function render(){
  if(tab === "list") renderList();
  else if(tab === "stats") renderStats();
  else renderSettings();
}

function renderList(){
  $("#title").textContent = "イベント参加履歴";
  $("#app").innerHTML = `
    <input class="search" id="q" type="search" placeholder="公演名・出演者・会場などで検索" value="${esc(query)}">
    ${filterBar()}
    <div id="listBody"></div>
  `;
  bindFilter();
  fillList();
  const qi = $("#q");
  let comp = false;
  qi.addEventListener("compositionstart", () => { comp = true; });
  qi.addEventListener("compositionend", () => { comp = false; query = qi.value; fillList(); });
  qi.addEventListener("input", () => { if(comp) return; query = qi.value; fillList(); });
}
/* 検索欄は作り直さず、結果の部分だけ更新する(日本語入力を妨げないため) */
function fillList(){
  const q = query.trim().toLowerCase();
  const rows = filtered()
    .filter(l => !q || ["title","artist","venue"].some(f => String(l[f] ?? "").toLowerCase().includes(q)))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const box = $("#listBody");
  if(!box) return;
  box.innerHTML = rows.length ? rows.map(l => `
      <div class="card item" data-id="${l.id}">
        <div class="t">${esc(l.title || l.artist || "(未入力)")}</div>
        ${l.title && l.artist ? `<div class="m a">${esc(l.artist)}</div>` : ""}
        <div class="m v">${fmtDate(l.date)}${l.venue ? " ・ " + esc(l.venue) : ""}</div>
      </div>`).join("") : `<div class="empty">${lives.length ? "該当なし" : "まだ記録がありません。<br>右下の＋から追加しましょう"}</div>`;
  box.querySelectorAll(".item").forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

function renderStats(){
  $("#title").textContent = "集計";
  const fl = filtered();
  const total = fl.length;
  const spend = fl.reduce((s, l) => s + (Number(l.price) || 0), 0);
  const artists = {}, venues = {};
  fl.forEach(l => {
    (l.artist || "").split(/[、,，]/).map(x => x.trim()).filter(Boolean).forEach(a => { artists[a] = (artists[a] || 0) + 1; });
    if(l.venue) venues[l.venue] = (venues[l.venue] || 0) + 1;
  });
  const sorted = o => Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
  const list = arr => arr.length ? arr.map(([k, v]) => `<div class="card" style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${v}回</b></div>`).join("") : `<div class="hint">データなし</div>`;
  $("#app").innerHTML = `
    ${filterBar()}
    <div class="stats">
      <div class="card"><b>${total}</b><small>参加数</small></div>
      <div class="card"><b>${spend ? yen(spend) : "-"}</b><small>チケット代合計</small></div>
    </div>
    <div class="seg" role="tablist"><button type="button" role="tab" id="sgA" class="${statTab === "artist" ? "on" : ""}" aria-selected="${statTab === "artist"}">出演者別</button><button type="button" role="tab" id="sgV" class="${statTab === "venue" ? "on" : ""}" aria-selected="${statTab === "venue"}">会場別</button></div>
    ${statTab === "venue" ? list(sorted(venues)) : list(sorted(artists))}`;
  bindFilter();
  $("#sgA").onclick = () => { statTab = "artist"; renderStats(); };
  $("#sgV").onclick = () => { statTab = "venue"; renderStats(); };
}

function renderSettings(){
  $("#title").textContent = "設定";
  const s = getSet();
  $("#app").innerHTML = `
    <div class="card">
      <b>Claude API</b>
      <label>APIキー</label>
      <input id="key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(s.apiKey || "")}">
      <label>モデル</label>
      <input id="model" value="${esc(s.model || DEFAULT_MODEL)}">
      <div class="hint">キーはこの端末のブラウザ内にだけ保存され、画像の読み取り時にAnthropicへ直接送信されます。他人と共有する端末では入力しないでください。</div>
      <button class="btn" id="saveSet">保存</button>
    </div>
    <div class="card">
      <b>バックアップ</b>
      <div class="hint">iOSはブラウザのデータが消えることがあります。定期的に書き出して、ファイルAppやiCloud Driveに保存してください。</div>
      <label class="btn sec" style="text-align:center">JSONを読み込む(追加・上書き)
        <input id="import" type="file" accept="application/json,.json" style="display:none">
      </label>
      <button class="btn sec" id="export">JSONを書き出す</button>
      <button class="btn sec" id="csv">CSVを書き出す</button>
    </div>
    <div class="card">
      <b>データ削除</b>
      <button class="btn danger" id="wipe">全データを削除</button>
    </div>
    <div class="hint" style="text-align:center">記録件数: ${lives.length}</div>
  `;
  $("#saveSet").onclick = () => {
    setSet({apiKey: $("#key").value.trim(), model: $("#model").value.trim() || DEFAULT_MODEL});
    alert("保存しました");
  };
  $("#export").onclick = exportJSON;
  $("#csv").onclick = exportCSV;
  $("#import").onchange = importJSON;
  $("#wipe").onclick = async () => {
    if(!confirm("全ての記録を削除します。元に戻せません。よろしいですか?")) return;
    await dbClear(); await refresh(); render();
  };
}

/* ========== 書き出し/読み込み ========== */
async function shareOrDownload(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file], title: name}); return; } catch(e){ if(e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function stamp(){ return new Date().toISOString().slice(0, 10); }
function exportJSON(){
  const blob = new Blob([JSON.stringify({version: 1, lives}, null, 1)], {type: "application/json"});
  shareOrDownload(blob, `livelog-${stamp()}.json`);
}
function exportCSV(){
  const cols = ["date","genre","title","artist","venue","open","start","seatType","seat","price","setlist"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [cols.join(",")].concat(lives.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(l => cols.map(c => q(c === "genre" ? genreOf(l) : l[c])).join(",")));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv"});
  shareOrDownload(blob, `livelog-${stamp()}.csv`);
}
async function importJSON(e){
  const f = e.target.files[0];
  if(!f) return;
  try {
    const j = JSON.parse(await f.text());
    const arr = Array.isArray(j) ? j : j.lives;
    if(!Array.isArray(arr)) throw new Error("形式が正しくありません");
    for(const l of arr){ if(l && l.id) await dbPut(l); }
    await refresh(); render();
    alert(`${arr.length}件を読み込みました`);
  } catch(err){ alert("読み込みに失敗: " + err.message); }
  e.target.value = "";
}

/* ========== 詳細 ========== */
function openDetail(id){
  const l = lives.find(x => x.id === id);
  if(!l) return;
  $("#title").textContent = "詳細";
  $("#fab").style.display = "none";
  const row = (k, v) => v ? `<div class="card"><small style="color:var(--sub)">${k}</small><div style="white-space:pre-wrap">${esc(v)}</div></div>` : "";
  $("#app").innerHTML = `
    <button class="btn sec" id="back" style="margin-top:0">← 戻る</button>
    <div class="card" style="margin-top:12px">
      <div class="t" style="font-size:18px;font-weight:700">${esc(l.title || l.artist || "(未入力)")}</div>
      <div class="m">${fmtDate(l.date)}${l.venue ? " ・ " + esc(l.venue) : ""}</div>
    </div>
    ${row("出演者", (l.artist || "").split("、").map(x => x.trim()).filter(Boolean).join("\n"))}
    ${row("開場 / 開演", [l.open, l.start].filter(Boolean).join(" / "))}
    ${row("席種", l.seatType)}
    ${row("座席・整理番号", l.seat)}
    ${row("チケット代", l.price !== "" && l.price != null ? yen(l.price) : "")}
    ${row("ジャンル", genreOf(l))}
    ${row("セットリスト", l.setlist)}
    ${l.photo ? `<img class="thumb" src="${l.photo}">` : ""}
    <button class="btn" id="edit">編集</button>
    <button class="btn danger" id="del">削除</button>
  `;
  $("#back").onclick = () => setTab("list");
  $("#edit").onclick = () => openForm(l);
  $("#del").onclick = async () => {
    if(!confirm("この記録を削除しますか?")) return;
    await dbDel(l.id); await refresh(); setTab("list");
  };
}

/* 抽出結果(オブジェクト)をフォームに反映 */
function applyResult(r){
  AUTO_FIELDS.forEach(k => {
    const val = r[k];
    if(val === undefined || val === null || val === "") return;
    if(k === "genre"){ if(GENRES.includes(val)){ const rb = document.querySelector('input[name="genre"][value="' + val + '"]'); if(rb) rb.checked = true; } return; }
    if(k === "artist"){ artistRows(Array.isArray(val) ? val.map(String) : splitArtists(val)); return; }
    const el = $("#f_" + k);
    if(!el) return;
    if(k === "memo" || k === "setlist"){
      el.value = el.value ? el.value + "\n" + val : String(val);
    } else if(k === "price"){
      el.value = String(val).replace(/[^\d]/g, "");
    } else {
      el.value = String(val);
    }
  });
}

/* ========== 入力フォーム ========== */
const splitArtists = s => String(s || "").split("、").map(x => x.trim()).filter(Boolean);
const readArtists = () => [...document.querySelectorAll(".f_artist")].map(i => i.value.trim());
function artistRows(list){
  const arr = list.length ? list : [""];
  $("#artists").innerHTML = arr.map((a, i) => `<div class="prow"><input class="f_artist" aria-label="出演者${i + 1}" value="${esc(a)}">${arr.length > 1 ? `<button type="button" class="rm" aria-label="出演者${i + 1}を削除">×</button>` : ""}</div>`).join("");
  document.querySelectorAll("#artists .rm").forEach((b, i) => b.onclick = () => { const cur = readArtists(); cur.splice(i, 1); artistRows(cur); });
}

function openForm(existing){
  const l = existing ? {...existing} : {id: uid(), createdAt: Date.now()};
  $("#title").textContent = existing ? "編集" : "新規記録";
  $("#fab").style.display = "none";
  const v = k => esc(l[k] ?? "");
  $("#app").innerHTML = `
    <button class="btn sec" id="cancel" style="margin-top:0">← キャンセル</button>
    <div class="card" style="margin-top:12px">
      <b>画像から自動入力</b>
      <div class="scan" style="margin-top:8px">
        <label class="btn">📷 撮影<input id="cam" type="file" accept="image/*" capture="environment"></label>
        <label class="btn sec">🖼 写真を選ぶ<input id="pick" type="file" accept="image/*"></label>
      </div>
      <img id="pv" class="preview" style="display:none">
      <div id="st" class="status"></div>
      <div class="hint">チケット・フライヤー・予約画面のスクリーンショットなど。読み取り結果は下のフォームに入るので、確認・修正してから保存してください。</div>
    </div>
    <div class="card">
      <b>チャットで読み取った結果を貼り付け</b>
      <textarea id="txt" placeholder="Claudeが返したJSONを貼り付け" style="min-height:70px"></textarea>
      <div class="row">
        <button class="btn sec" id="paste" style="margin-top:8px">📋 クリップボードから</button>
        <button class="btn" id="applyTxt" style="margin-top:8px">反映</button>
      </div>
      <div id="st2" class="status"></div>
      <div class="hint">複数件のJSON(配列)を貼ると、まとめて保存できます。</div>
    </div>
    <div class="card">
      <label style="margin-top:0">ジャンル</label><div class="chips" role="radiogroup" aria-label="ジャンル">${GENRES.map(g => `<label class="chip"><input type="radio" name="genre" value="${g}"${genreOf(l) === g ? " checked" : ""}><span>${g}</span></label>`).join("")}</div>
      <label>公演名</label><textarea id="f_title" style="min-height:110px">${v("title")}</textarea>
      <label>出演者</label><div id="artists"></div>
      <button type="button" class="btn sec" id="addArtist" style="margin-top:8px">＋ 出演者を追加</button>
      <label>会場</label><input id="f_venue" value="${v("venue")}">
      <label>日付</label><input id="f_date" type="date" value="${v("date")}">
      <div class="row">
        <div><label>開場</label><input id="f_open" type="time" value="${v("open")}"></div>
        <div><label>開演</label><input id="f_start" type="time" value="${v("start")}"></div>
      </div>
      <label>席種</label><input id="f_seatType" value="${v("seatType")}">
      <label>座席・整理番号</label><input id="f_seat" value="${v("seat")}">
      <label>チケット代(円)</label><input id="f_price" type="number" inputmode="numeric" value="${v("price")}">
      <label>セットリスト</label><textarea id="f_setlist">${v("setlist")}</textarea>
    </div>
    <button class="btn" id="save">保存</button>
  `;
  artistRows(splitArtists(l.artist));
  $("#addArtist").onclick = () => { const cur = readArtists(); cur.push(""); artistRows(cur); const ins = document.querySelectorAll(".f_artist"); ins[ins.length - 1].focus(); };
  $("#cancel").onclick = () => existing ? openDetail(existing.id) : setTab("list");

  if(l.photo){ const pv = $("#pv"); pv.src = l.photo; pv.style.display = "block"; }

  const handle = async e => {
    const file = e.target.files[0];
    if(!file) return;
    const st = $("#st");
    st.className = "status"; st.textContent = "読み取り中…";
    try {
      const big = await resizeImage(file, 1600, 0.85);
      const small = await resizeImage(file, 600, 0.7);
      l.photo = small;
      const pv = $("#pv"); pv.src = small; pv.style.display = "block";
      const r = await extractFromImage(big);
      applyResult(r);
      st.className = "status ok"; st.textContent = "読み取り完了。内容を確認してください。";
    } catch(err){
      st.className = "status err"; st.textContent = err.message;
    }
    e.target.value = "";
  };
  $("#cam").onchange = handle;
  $("#pick").onchange = handle;

  const runTxt = async text => {
    const st2 = $("#st2");
    try {
      const m = /[\[{][\s\S]*[\]}]/.exec(text || "");
      if(!m) throw new Error("JSONが見つかりません");
      let j = JSON.parse(m[0]);
      if(Array.isArray(j) && j.length > 1){
        if(!confirm(`${j.length}件をまとめて保存しますか?`)) return;
        for(const r of j){
          const o = {id: uid(), createdAt: Date.now(), updatedAt: Date.now()};
          AUTO_FIELDS.forEach(k => { o[k] = r[k] ?? ""; });
          o.genre = o.genre === "ライブ" ? "音楽" : o.genre === "演劇" ? "舞台" : GENRES.includes(o.genre) ? o.genre : "音楽";
          const p = Number(String(o.price).replace(/[^\d]/g, ""));
          o.price = o.price === "" ? "" : (p || "");
          await dbPut(o);
        }
        await refresh(); setTab("list");
        return;
      }
      if(Array.isArray(j)) j = j[0];
      if(!j || typeof j !== "object") throw new Error("形式が正しくありません");
      applyResult(j);
      st2.className = "status ok"; st2.textContent = "反映しました。内容を確認して保存してください。";
    } catch(err){
      st2.className = "status err"; st2.textContent = "取り込めませんでした: " + err.message;
    }
  };
  $("#paste").onclick = async () => {
    try {
      const t = await navigator.clipboard.readText();
      $("#txt").value = t;
      await runTxt(t);
    } catch(e){
      $("#st2").className = "status err";
      $("#st2").textContent = "貼り付けできませんでした。枠を長押しして貼り付けてから「反映」を押してください。";
    }
  };
  $("#applyTxt").onclick = () => runTxt($("#txt").value);

  $("#save").onclick = async () => {
    FIELDS.forEach(k => { if(k !== "artist" && k !== "genre") l[k] = $("#f_" + k).value.trim(); });
    { const gr = document.querySelector('input[name="genre"]:checked'); l.genre = gr ? gr.value : "音楽"; }
    l.title = l.title.replace(/\s*\n\s*/g, " ");
    l.artist = readArtists().filter(Boolean).join("、");
    if(!l.artist && !l.title){ alert("公演名か出演者を入力してください"); return; }
    l.price = l.price === "" ? "" : Number(l.price);
    l.updatedAt = Date.now();
    await dbPut(l);
    await refresh();
    openDetail(l.id);
  };
}

/* ========== 起動 ========== */
(async () => {
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  await refresh();
  setTab("list");
})();
</script>
</body>
</html>
