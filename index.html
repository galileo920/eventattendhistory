<style>

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}

<body>
<div class="bar"><div class="bar-in"><h1>イベント参加履歴</h1><span class="count" id="count"></span></div></div>
<main id="app"></main>
<button class="fab" id="fab" aria-label="イベントを追加">+</button>
<nav class="tabbar"><div class="tabbar-in">
  <button data-tab="list" class="on">履歴</button>
  <button data-tab="stats">集計</button>
  <button data-tab="settings">設定</button>
</div></nav>

<script>
"use strict";
/* ========== IndexedDB ========== */
const DB_NAME = "livelog", STORE = "lives";
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
let dbp = openDB();
async function tx(mode, fn){
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx("readonly", s => s.getAll());
const dbPut = v => tx("readwrite", s => s.put(v));
const dbDel = id => tx("readwrite", s => s.delete(id));
const dbClear = () => tx("readwrite", s => s.clear());

/* ========== 設定(localStorage) ========== */
const DEFAULT_MODEL = "claude-sonnet-5-5";
function getSet(){
  try { return JSON.parse(localStorage.getItem("livelog_settings") || "{}"); } catch(e){ return {}; }
}
function setSet(o){
  try { localStorage.setItem("livelog_settings", JSON.stringify({...getSet(), ...o})); } catch(e){}
}

/* ========== ユーティリティ ========== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GENRES = ["音楽","お笑い","舞台","トーク"];
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const normPref = v => { const t = String(v || "").trim(); if(!t) return ""; return PREFS.find(x => x === t) || PREFS.find(x => x.replace(/[都道府県]$/, "") === t.replace(/[都道府県]$/, "")) || ""; };
const venueLabel = l => l.venue ? l.venue + (l.pref ? `(${l.pref})` : "") : (l.pref || "");
const genreOf = l => l && l.genre === "ライブ" ? "音楽" : l && l.genre === "演劇" ? "舞台" : GENRES.includes(l && l.genre) ? l.genre : "音楽";
const FIELDS = ["genre","title","artist","venue","pref","date","open","start","seatType","seat","price","setlist"];
/* 自動入力・貼り付け取り込みの対象(同行者・セットリスト・メモは手入力のみ) */
const AUTO_FIELDS = ["genre","title","artist","venue","pref","date","open","start","seatType","seat","price"];

function fmtDate(d){
  if(!d) return "日付未設定";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  if(!m) return d;
  const w = "日月火水木金土"[new Date(+m[1], +m[2]-1, +m[3]).getDay()];
  return `${m[1]}/${+m[2]}/${+m[3]}(${w})`;
}
function yen(n){ return n || n === 0 ? "¥" + Number(n).toLocaleString() : ""; }

/* 画像を縮小してJPEGのdataURLに */
function resizeImage(file, max, quality){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

/* ========== Claude API ========== */
async function extractFromImage(dataUrl){
  const {apiKey, model} = getSet();
  if(!apiKey) throw new Error("設定タブでAPIキーを入力してください");
  const b64 = dataUrl.split(",")[1];
  const prompt = `この画像はライブ・コンサートなどのイベントの紙のチケット、電子チケット(チケットぴあ・イープラス・ローチケ等のアプリ画面のスクリーンショット)、フライヤー、ポスター、または予約画面です。購入者の名前は含めないでください。複数日にまたがる券の場合、dateは初日にしてください。読み取れる情報を次のJSONだけで返してください(説明文やコードブロックは不要)。読み取れない項目は空文字にしてください。推測で埋めないでください。
{
 "genre":"ジャンル(音楽・お笑い・舞台・トークのいずれか。判断できなければ空文字)",
 "title":"公演名・イベント名・ツアー名",
 "artist":"出演者名(複数の場合は「、」で区切る)",
 "date":"開催日 YYYY-MM-DD(年が不明なら ${new Date().getFullYear()} とみなす)",
 "venue":"会場名",
 "pref":"会場がある都道府県名(例: 東京都、大阪府、北海道)。会場名や記載から確実に分かる場合のみ。分からなければ空文字",
 "open":"開場時刻 HH:MM",
 "start":"開演時刻 HH:MM",
 "seatType":"席種・券種(例: 一般指定席、スタンディング、グッズ付指定席)",
 "seat":"座席・整理番号(例: 11列40番、整理番号C 266番)",
 "price":"チケット代(数字のみ)"
}`;
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: model || DEFAULT_MODEL,
      max_tokens: 1000,
      messages: [{role: "user", content: [
        {type: "image", source: {type: "base64", media_type: "image/jpeg", data: b64}},
        {type: "text", text: prompt}
      ]}]
    })
  });
  if(!r.ok){
    let msg = "";
    try { msg = (await r.json()).error?.message || ""; } catch(e){}
    throw new Error(`APIエラー(${r.status}) ${msg}`);
  }
  const j = await r.json();
  const text = (j.content || []).map(c => c.text || "").join("");
  const m = /\{[\s\S]*\}/.exec(text);
  if(!m) throw new Error("読み取り結果を解析できませんでした");
  return JSON.parse(m[0]);
}

/* ========== 画面 ========== */
let tab = "list";
let lives = [];
let query = "", exact = null;
let fGenre = "", fYear = "", statTab = "artist";
const yearOf = l => (l.date || "").slice(0, 4);
const filtered = () => lives.filter(l => (!fGenre || genreOf(l) === fGenre) && (!fYear || yearOf(l) === fYear));
function filterBar(){
  const ys = [...new Set(lives.map(yearOf).filter(Boolean).concat(fYear ? [fYear] : []))].sort().reverse();
  return `<div class="filters"><select id="fg" aria-label="ジャンルで絞り込み"><option value="">ジャンル(すべて)</option>${GENRES.map(g => `<option value="${g}"${fGenre === g ? " selected" : ""}>${g}</option>`).join("")}</select><select id="fy" aria-label="年で絞り込み"><option value="">年(すべて)</option>${ys.map(y => `<option value="${y}"${fYear === y ? " selected" : ""}>${y}年</option>`).join("")}</select></div>`;
}
function bindFilter(){
  $("#fg").onchange = e => { fGenre = e.target.value; render(); };
  $("#fy").onchange = e => { fYear = e.target.value; render(); };
}


async function refresh(){ lives = await dbAll(); const c = $("#count"); if(c) c.textContent = lives.length ? `${lives.length} 件` : ""; }

function setTab(t){
  tab = t;
  window.scrollTo(0, 0);
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#fab").style.display = t === "list" ? "" : "none";
  render();
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { exact = null; setTab(b.dataset.tab); });
$("#fab").onclick = () => openForm();

function render(){
  if(tab === "list") renderList();
  else if(tab === "stats") renderStats();
  else renderSettings();
}

function dateParts(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || "");
  if(!m) return null;
  return {y:m[1], m:+m[2], d:+m[3], w:"日月火水木金土"[new Date(+m[1], +m[2]-1, +m[3]).getDay()]};
}
function renderList(){
  $("#app").innerHTML = `
    <input class="search" id="q" type="search" placeholder="公演名・出演者・会場などで検索" value="${esc(query)}">
    ${filterBar()}
    ${exact ? `<div class="exact"><span>${exact.kind === "venue" ? "会場" : exact.kind === "pref" ? "都道府県" : "出演者"}「${esc(exact.value)}」と完全一致</span><button type="button" id="exOff">解除</button></div>` : ""}
    <div id="listBody"></div>
  `;
  bindFilter();
  if(exact) $("#exOff").onclick = () => { exact = null; renderList(); };
  fillList();
  const qi = $("#q");
  let comp = false;
  qi.addEventListener("compositionstart", () => { comp = true; });
  qi.addEventListener("compositionend", () => { comp = false; query = qi.value; fillList(); });
  qi.addEventListener("input", () => { if(comp) return; query = qi.value; fillList(); });
}
/* 検索欄は作り直さず、結果の部分だけ更新する(日本語入力を妨げないため) */
function fillList(){
  const q = query.trim().toLowerCase();
  const rows = filtered()

    .filter(l => !q || ["title","artist","venue"].some(f => String(l[f] ?? "").toLowerCase().includes(q)))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  box.querySelectorAll(".stub").forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

/* ========== 書き出し/読み込み ========== */
async function shareOrDownload(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file], title: name}); return; } catch(e){ if(e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function stamp(){ return new Date().toISOString().slice(0, 10); }
function exportJSON(){
  const blob = new Blob([JSON.stringify({version: 1, lives}, null, 1)], {type: "application/json"});
  shareOrDownload(blob, `livelog-${stamp()}.json`);
}
function exportCSV(){
  const cols = ["date","genre","title","artist","venue","pref","open","start","seatType","seat","price","setlist"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [cols.join(",")].concat(lives.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(l => cols.map(c => q(c === "genre" ? genreOf(l) : l[c])).join(",")));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv"});
  shareOrDownload(blob, `livelog-${stamp()}.csv`);
}
async function importJSON(e){
  const f = e.target.files[0];
  if(!f) return;
  try {
    const j = JSON.parse(await f.text());
    const arr = Array.isArray(j) ? j : j.lives;
    if(!Array.isArray(arr)) throw new Error("形式が正しくありません");
    for(const l of arr){ if(l && l.id) await dbPut(l); }
    await refresh(); render();
    alert(`${arr.length}件を読み込みました`);
  } catch(err){ alert("読み込みに失敗: " + err.message); }
  e.target.value = "";
}

/* 抽出結果(オブジェクト)をフォームに反映 */
function applyResult(r){
  AUTO_FIELDS.forEach(k => {
    const val = r[k];
    if(val === undefined || val === null || val === "") return;
    if(k === "genre"){ if(GENRES.includes(val)){ const rb = document.querySelector('input[name="genre"][value="' + val + '"]'); if(rb) rb.checked = true; } return; }
    if(k === "artist"){ artistRows(Array.isArray(val) ? val.map(String) : splitArtists(val)); return; }
    const el = $("#f_" + k);
    if(!el) return;
    if(k === "pref"){ el.value = normPref(val); return; }
    if(k === "memo" || k === "setlist"){
      el.value = el.value ? el.value + "\n" + val : String(val);
    } else if(k === "price"){
      el.value = String(val).replace(/[^\d]/g, "");
    } else {
      el.value = String(val);
    }
  });
}

/* ========== 入力フォーム ========== */
const splitArtists = s => String(s || "").split("、").map(x => x.trim()).filter(Boolean);
/* 並び順: 記号 → 数字 → 英字 → 日本語(読みの情報がないので、日本語は文字コード順) */
const sortNames = list => {
  const key = n => { const t = String(n).normalize("NFKC").replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).trim(), c = t.charAt(0);
    return [!/[\p{L}\p{N}]/u.test(c) ? 0 : /[0-9]/.test(c) ? 1 : /[A-Za-z]/.test(c) ? 2 : 3, t.toLowerCase()]; };
  return list.filter(Boolean).map(n => ({n, k: key(n)})).sort((a, b) => a.k[0] - b.k[0] || a.k[1].localeCompare(b.k[1], "ja")).map(o => o.n);
};
const readArtists = () => [...document.querySelectorAll(".f_artist")].map(i => i.value.trim());
function artistRows(list){
  const arr = (list.length ? list : [""]).map(x => typeof x === "string" ? {name: x} : x);
  $("#artists").innerHTML = arr.map((a, i) => `<div class="prow"><input class="f_artist" aria-label="出演者${i + 1}" value="${esc(a.name)}">${arr.length > 1 ? `<button type="button" class="grip" aria-label="出演者${i + 1}を並べ替え(押したまま上下に動かす)">≡</button><button type="button" class="rm" aria-label="出演者${i + 1}を削除">×</button>` : ""}</div>`).join("");
  document.querySelectorAll("#artists .rm").forEach(b => b.onclick = () => { const cur = readArtists(); cur.splice([...document.querySelectorAll("#artists .rm")].indexOf(b), 1); artistRows(cur); });
  document.querySelectorAll("#artists .grip").forEach(g => {
    g.onpointerdown = ev => { if(ev.pointerType === "touch") return; ev.preventDefault(); dragArtist(ev, g, false); };
    g.addEventListener("touchstart", ev => { if(!ev.touches.length) return; ev.preventDefault(); dragArtist(ev.touches[0], g, true); }, {passive: false});
  });
}
/* ≡ を押したまま上下に動かして並べ替える(指でもマウスでも動く) */
function dragArtist(ev, grip, isTouch){
  const box = $("#artists"), row = grip.closest(".prow");
  const rows = [...box.querySelectorAll(".prow")], from = rows.indexOf(row);
  let sc = box.parentElement;
  while(sc && sc !== document.body && !(sc.scrollHeight > sc.clientHeight + 2 && /(auto|scroll)/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
  const useWin = !sc || sc === document.body;
  const getS = () => useWin ? (window.scrollY || document.documentElement.scrollTop || 0) : sc.scrollTop;
  const setS = d => { if(useWin) window.scrollBy(0, d); else sc.scrollTop += d; };
  const top = useWin ? 0 : sc.getBoundingClientRect().top, bot = useWin ? window.innerHeight : sc.getBoundingClientRect().bottom;
  /* 動かしている間は並べ替えず、見た目だけずらす。離したときにまとめて入れ替える(指を離すまで要素を動かさないので、iPhoneでも途切れない) */
  const s0 = getS(), y0 = ev.clientY;
  const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 + s0; });
  const h = rows[from].getBoundingClientRect().height + 6;
  let curY = y0, to = from;
  row.classList.add("drag"); row.style.position = "relative"; row.style.zIndex = "5"; row.style.transition = "none";
  rows.forEach(r => { if(r !== row) r.style.transition = "transform .12s"; });
  if(!isTouch){ try { grip.setPointerCapture(ev.pointerId); } catch(e){} }
  const update = () => {
    const dy = curY - y0 + (getS() - s0);
    row.style.transform = `translateY(${dy}px)`;
    const c = mids[from] + dy;
    to = 0; rows.forEach((r, i) => { if(i !== from && mids[i] < c) to++; });
    rows.forEach((r, i) => { if(i === from) return; r.style.transform = (from < to && i > from && i <= to) ? `translateY(${-h}px)` : (from > to && i < from && i >= to) ? `translateY(${h}px)` : ""; });
  };
  const move = e => { if(isTouch){ e.preventDefault(); if(!e.touches.length) return; curY = e.touches[0].clientY; } else curY = e.clientY; update(); };
  const tick = setInterval(() => { const d = curY < top + 50 ? -12 : curY > bot - 50 ? 12 : 0; if(d){ setS(d); update(); } }, 30);
  const end = e => {
    clearInterval(tick);
    if(isTouch){ grip.removeEventListener("touchmove", move); grip.removeEventListener("touchend", end); grip.removeEventListener("touchcancel", end); }
    else { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", end); grip.removeEventListener("pointercancel", end); }
    const list = readArtists(); const [m] = list.splice(from, 1); list.splice(to, 0, m);
    artistRows(list);
  };
  if(isTouch){ grip.addEventListener("touchmove", move, {passive: false}); grip.addEventListener("touchend", end); grip.addEventListener("touchcancel", end); }
  else { grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", end); grip.addEventListener("pointercancel", end); }
}

  };
}

/* ========== 起動 ========== */
(async () => {
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  await refresh();
  setTab("list");
})();
</script>
